<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Let’s Go · Stu's view</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* TLR Design System v1.0 */
:root { --navy: #0F1215; --cream: #F5F1EB; --cream-dark: #EDE8DF; --cream-deep: #E5DDD1; --white: #FFFFFF; --text: #1A1A1A; --text-mid: #4A4A4A; --muted: #888880; --amber: #C9930A; --green: #3B6D11;
  --display: 'Playfair Display', Georgia, serif; --body: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--cream); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.5; }
header { background: var(--navy); padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 14px; display: flex; align-items: center; justify-content: space-between; }
header img { height: 40px; display: block; }
header button { min-height: 44px; padding: 0 14px; border: 1px solid rgba(255,255,255,0.35); border-radius: 4px; background: transparent; color: var(--white); font: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; display: flex; flex-direction: column; gap: 22px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-mid); }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 7vw, 40px); line-height: 1.1; margin: 2px 0 0; }
h2 { font-size: 18px; font-weight: 600; margin: 0; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.card { background: var(--white); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--white); border-radius: 6px; padding: 14px 16px; }
.tile b { display: block; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile span { color: var(--text-mid); font-size: 13px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--cream-deep); vertical-align: top; }
th { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-mid); }
td.n { font-variant-numeric: tabular-nums; text-align: right; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--cream-dark); }
.pill.good { background: #e5f4e4; color: var(--green); } .pill.mixed { background: #f9eeda; color: #7a5a06; } .pill.tough { background: #f9ece7; color: #8C4A2F; }
.note { background: var(--cream-dark); border-radius: 6px; padding: 14px 16px; }
select { font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--muted); background: var(--white); min-height: 44px; }
.bar { height: 8px; border-radius: 4px; background: var(--cream-deep); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--amber); }
.row { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.wordmark { font-family: Poppins, sans-serif; font-weight: 700; font-size: 24px; line-height: 1; letter-spacing: -0.01em; color: #FFFFFF; white-space: nowrap; }
.wordmark .bang { color: #C9930A; }
</style>
</head>
<body>
<header>
  <span class="wordmark">Let’s Go<span class="bang">!</span></span>
  <button type="button" onclick="history.back()">Back</button>
</header>
<main id="main">
  <div><div class="eyebrow">Let’s Go · only you can see this</div><h1>How it’s going</h1></div>
  <p class="hint" id="status">Loading…</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var sb = window.supabase.createClient('https://ycxmhilwaixfwiedkkzj.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljeG1oaWx3YWl4ZndpZWRra3pqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5ODY1MjUsImV4cCI6MjEwODU2MjUyNX0.XRe4jBt4RYwwnAxwnSmVVGf_DtEiHn7yasgk6Rfb3tU');
  var main = document.getElementById('main'), status = document.getElementById('status');
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var when = function (t) { var d = new Date(t); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); };
  var NICE = { open: 'App opened', screen: 'Screen viewed', tap: 'Tap', nudgeask: 'Nudge ask', checkin: 'Weekly check-in', ideas: 'Challenge ideas', calendar: 'Calendar added' };
  var SCREEN = { landing: 'Welcome', name: 'Name', viewpick: 'Choose view', what: 'Step 1: habit', when: 'Step 2: when', feel: 'How it’ll feel', less: 'Instead', dimmer: 'Tough-day plan', ready: 'Plan ready', install: 'Get the app', tracker: 'Home', slipped: 'I’m struggling', plan: 'My plan', settings: 'Settings', find: 'Challenge ideas', account: 'Add email', calendar: 'Calendar', reflect: 'Day-30 look back', share: 'Share', wins: 'Past wins', note: 'Note', science: 'How it works' };
  async function load(days) {
    var sess = (await sb.auth.getSession()).data.session;
    if (!sess) { status.innerHTML = 'Open the Let’s Go app on this device and add your email (stuart.fairbairns@gmail.com) first. Then come back here.'; return; }
    if ((sess.user.email || '').toLowerCase() !== 'stuart.fairbairns@gmail.com') { status.textContent = 'This page is only for Stuart.'; return; }
    var r = await Promise.all([
      sb.rpc('showup_pilot_summary'),
      sb.rpc('showup_usage_summary', { since_days: days }),
      sb.rpc('showup_feedback_admin', { since_days: days })
    ]);
    var people = r[0].data || [], usage = r[1].data || [], fb = r[2].data;
    if (r[2].error) { var raw = await sb.from('showup_feedback').select('question,answer,created_at').order('created_at', { ascending: false }).limit(200); fb = (raw.data || []).map(function (x) { return Object.assign({ email: '(name to come)' }, x); }); }
    render(days, people, usage, fb || []);
  }
  // Tester feedback: grouped by the "how would you feel" answer, the way Superhuman read theirs.
  var QN = { disappointed: 'If they could no longer use it', toughday: 'Last tough day', nearlystopped: 'Nearly stopped?', stuck: 'Stuck, confused or annoyed', automatic: 'Habit feels automatic (1 to 5)', friend: 'What they’d tell a friend', change: 'One thing to change', paid: 'Paid for before', missed: 'Anything I should have asked' };
  function tally(list, k) { var m = {}; list.forEach(function (t) { var a = (t.answers || {})[k]; if (!a || !a.pick) return; [].concat(a.pick).forEach(function (p) { m[p] = (m[p] || 0) + 1; }); }); return m; }
  function tallyHTML(title, m, total) { var ks = Object.keys(m).sort(function (a, b) { return m[b] - m[a]; }); if (!ks.length) return ''; return '<div><b style="font-weight:600">' + esc(title) + '</b>' + ks.map(function (k) { return '<div class="row"><span>' + esc(k) + '</span><span class="hint">' + m[k] + ' of ' + total + '</span></div><div class="bar"><i style="width:' + Math.round(m[k] / total * 100) + '%"></i></div>'; }).join('') + '</div>'; }
  function testerSection(list) {
    var h = '<section class="card"><h2>Tester feedback</h2>';
    if (!list.length) return h + '<p class="hint">No feedback yet. Send testers the link: motivate-coaching.github.io/tlr-hub/letsgo/feedback.html</p></section>';
    var d = tally(list, 'disappointed'), answered = Object.keys(d).reduce(function (a, k) { return a + d[k]; }, 0), very = d['Very disappointed'] || 0;
    var auto = list.map(function (t) { return Number(((t.answers || {}).automatic || {}).pick); }).filter(function (x) { return x > 0; });
    h += '<div class="tiles"><div class="tile"><b>' + list.length + '</b><span>people sent feedback</span></div>' +
      '<div class="tile"><b>' + very + ' of ' + answered + '</b><span>would be very disappointed without it (aim for 40%+)</span></div>' +
      '<div class="tile"><b>' + (auto.length ? (auto.reduce(function (a, b) { return a + b; }, 0) / auto.length).toFixed(1) : '–') + '</b><span>habit feels automatic, out of 5</span></div></div>';
    h += tallyHTML(QN.disappointed, d, list.length) + tallyHTML(QN.toughday, tally(list, 'toughday'), list.length) + tallyHTML(QN.nearlystopped, tally(list, 'nearlystopped'), list.length) + tallyHTML(QN.stuck, tally(list, 'stuck'), list.length) + tallyHTML(QN.paid, tally(list, 'paid'), list.length);
    var order = ['Very disappointed', 'Somewhat disappointed', 'Not disappointed', 'I’d already stopped using it', ''];
    order.forEach(function (g) {
      var grp = list.filter(function (t) { return (((t.answers || {}).disappointed || {}).pick || '') === g; }); if (!grp.length) return;
      h += '<h2 style="margin-top:8px">' + esc(g || 'Didn’t answer the first question') + ' (' + grp.length + ')</h2>';
      grp.forEach(function (t) {
        var u = t.usage, who = (t.name || t.email || 'A tester');
        h += '<div class="note"><div class="row"><b style="font-weight:600">' + esc(who) + '</b><span class="hint">' + esc(when(t.at)) + '</span></div>' +
          (u ? '<p class="hint">' + esc(u.habit || '') + ': day ' + u.day + ' of ' + u.length + ', ' + u.showups + ' show-ups, ' + u.lighter + ' lighter, ' + u.comebacks + ' comebacks' + (u.view === 'focus' ? ', Focused view' : '') + '</p>' : '');
        Object.keys(QN).forEach(function (k) { var a = (t.answers || {})[k]; if (!a) return; var p = a.pick ? [].concat(a.pick).join(', ') : ''; h += '<p style="margin:8px 0 0"><span class="hint">' + esc(QN[k]) + '</span><br>' + (p ? '<b style="font-weight:600">' + esc(p) + '</b>' : '') + (p && a.text ? '. ' : '') + esc(a.text || '') + '</p>'; });
        h += '</div>';
      });
    });
    return h + '<p class="hint">Look for themes that come up 3 or more times, and compare what people say with what they actually did.</p></section>';
  }
  function count(usage, ev, det) { return usage.filter(function (u) { return u.event === ev && (det === undefined || u.detail === det); }).reduce(function (a, u) { return a + Number(u.times); }, 0); }
  function people(usage, ev, det) { return usage.filter(function (u) { return u.event === ev && (det === undefined || u.detail === det); }).reduce(function (a, u) { return a + Number(u.people); }, 0); }
  function render(days, pl, usage, fb) {
    var active = pl.filter(function (p) { return p.last_tick && (Date.now() - new Date(p.last_tick)) < 7 * 864e5; }).length;
    var opens = people(usage, 'open'), focus = usage.filter(function (u) { return u.event === 'open' && u.view_mode === 'focus'; }).reduce(function (a, u) { return a + Number(u.people); }, 0);
    var testers = fb.filter(function (f) { return f.question === 'tester-feedback'; }).map(function (f) { var j = {}; try { j = JSON.parse(f.answer); } catch (e) {} j.at = f.created_at; j.email = f.email; return j; });
    fb = fb.filter(function (f) { return f.question !== 'tester-feedback'; });
    var checks = fb.filter(function (f) { return /^checkin/.test(f.question); });
    var h = '<div><div class="eyebrow">Let’s Go · only you can see this</div><h1>How it’s going</h1></div>' +
      '<div class="row"><p class="hint">Last ' + days + ' days. People in the summary are those who have added their email.</p><label class="hint">Period <select id="days"><option value="7">7 days</option><option value="30">30 days</option><option value="90">90 days</option></select></label></div>' +
      '<div class="tiles">' +
      '<div class="tile"><b>' + pl.length + '</b><span>people with a habit</span></div>' +
      '<div class="tile"><b>' + active + '</b><span>showed up in the last 7 days</span></div>' +
      '<div class="tile"><b>' + opens + '</b><span>app opens (people)</span></div>' +
      '<div class="tile"><b>' + (opens ? Math.round(focus / opens * 100) : 0) + '%</b><span>using Focused view</span></div>' +
      '<div class="tile"><b>' + checks.length + '</b><span>weekly check-ins</span></div></div>';
    h += testerSection(testers);
    // Check-ins and feedback
    h += '<section class="card"><h2>Check-ins and feedback</h2>';
    if (!fb.length) h += '<p class="hint">Nothing yet. Check-ins start on day 7 for people who’ve added their email.</p>';
    else {
      h += '<div class="scroll"><table><tr><th>When</th><th>Who</th><th>What</th><th>Answer</th></tr>';
      fb.forEach(function (f) {
        var a = String(f.answer || ''), cls = a === 'Going well' ? 'good' : a === 'Mixed' ? 'mixed' : a === 'Tough' ? 'tough' : '';
        var q = /^checkin-day(\d+)/.test(f.question) ? 'Check-in, day ' + f.question.replace(/\D/g, '') : f.question === 'day3' ? 'Day 3: anything confusing?' : f.question;
        h += '<tr><td>' + esc(when(f.created_at)) + '</td><td>' + esc(f.email) + '</td><td>' + esc(q) + '</td><td>' + (cls ? '<span class="pill ' + cls + '">' + esc(a) + '</span>' : esc(a)) + '</td></tr>';
      });
      h += '</table></div>';
    }
    h += '</section>';
    // Who's showing up
    h += '<section class="card"><h2>Who’s showing up</h2>';
    if (!pl.length) h += '<p class="hint">No one with a saved habit yet.</p>';
    else {
      h += '<div class="scroll"><table><tr><th>Who</th><th>Habit</th><th>Started</th><th class="n">Show-ups</th><th class="n">Lighter days</th><th class="n">Comebacks</th><th>Last show-up</th></tr>';
      pl.forEach(function (p) { h += '<tr><td>' + esc(p.email) + '</td><td>' + esc(p.habit) + '</td><td>' + esc(p.start_date) + '</td><td class="n">' + p.show_ups + ' of ' + p.length_days + '</td><td class="n">' + p.dimmer_days + '</td><td class="n">' + p.comebacks + '</td><td>' + (p.last_tick ? esc(when(p.last_tick)) : 'not yet') + '</td></tr>'; });
      h += '</table></div>';
    }
    h += '<p class="hint">Show-ups only. Nobody’s notes are ever shown here.</p></section>';
    // Where people go
    var screens = usage.filter(function (u) { return u.event === 'screen'; }).reduce(function (m, u) { m[u.detail] = (m[u.detail] || 0) + Number(u.people); return m; }, {});
    var list = Object.keys(screens).sort(function (a, b) { return screens[b] - screens[a]; }), top = list.length ? screens[list[0]] : 1;
    h += '<section class="card"><h2>Where people go</h2><p class="hint">How many people reached each screen.</p>';
    if (!list.length) h += '<p class="hint">No visits yet.</p>';
    list.slice(0, 20).forEach(function (s) { h += '<div><div class="row"><span>' + esc(SCREEN[s] || s) + '</span><span class="hint">' + screens[s] + '</span></div><div class="bar"><i style="width:' + Math.round(screens[s] / top * 100) + '%"></i></div></div>'; });
    h += '</section>';
    // Key moments
    var km = [
      ['Nudge ask: said yes', people(usage, 'nudgeask', 'yes') + people(usage, 'nudgeask', 'email')], ['Nudge ask: not now', people(usage, 'nudgeask', 'not now')],
      ['Challenge ideas: took a suggestion', usage.filter(function (u) { return u.event === 'ideas' && /^took/.test(u.detail || ''); }).reduce(function (a, u) { return a + Number(u.people); }, 0)],
      ['Challenge ideas: wrote their own', people(usage, 'ideas', 'own')],
      ['Calendar: Apple or Outlook', people(usage, 'calendar', 'ics')], ['Calendar: Google', people(usage, 'calendar', 'google')]
    ];
    h += '<section class="card"><h2>Key moments</h2><div class="scroll"><table>' + km.map(function (k) { return '<tr><td>' + k[0] + '</td><td class="n">' + k[1] + '</td></tr>'; }).join('') + '</table></div></section>';
    h += '<p class="note hint">Usage counts come from people who haven’t switched off “Help improve Let’s Go”. Nothing anyone writes is collected.</p>';
    main.innerHTML = h;
    var sel = document.getElementById('days'); sel.value = String(days); sel.onchange = function () { main.innerHTML = '<p class="hint">Loading…</p>'; load(+sel.value); };
  }
  load(30).catch(function (e) { status.textContent = 'Couldn’t load just now: ' + (e && e.message || e); });
})();
</script>
</body>
</html>
