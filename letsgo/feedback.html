<style>
/* TLR Design System v1.0, Let's Go branding. One question per screen, big equal taps, a count that never grows. */
:root { --navy: #0F1215; --cream: #F5F1EB; --cream-dark: #EDE8DF; --cream-deep: #E5DDD1; --white: #FFFFFF; --text: #1A1A1A; --text-mid: #4A4A4A; --muted: #888880; --amber: #C9930A;
  --display: 'Playfair Display', Georgia, serif; --body: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--cream); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
header { position: sticky; top: 0; z-index: 5; background: var(--navy); padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 14px; display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; }
header .back { justify-self: start; min-height: 44px; min-width: 44px; border: 0; background: transparent; color: var(--white); font: inherit; font-size: 15px; cursor: pointer; padding: 0 4px; }
header .back[hidden] { visibility: hidden; display: block; }
.wordmark { justify-self: center; font-weight: 700; font-size: 24px; line-height: 1; letter-spacing: -0.01em; color: var(--white); white-space: nowrap; }
.brand { font-family: Poppins, system-ui, sans-serif; font-weight: 700; font-style: normal; letter-spacing: -0.01em; text-transform: none; white-space: nowrap; }
.bang { color: var(--amber); }
.prog { height: 6px; background: var(--cream-deep); }
.prog i { display: block; height: 100%; background: var(--amber); width: 0; transition: width 300ms ease; }
main { max-width: 560px; margin: 0 auto; padding: 22px 16px calc(40px + env(safe-area-inset-bottom, 0px)); min-height: calc(100vh - 80px); display: flex; flex-direction: column; gap: 18px; }
.screen { display: flex; flex-direction: column; gap: 16px; animation: in 260ms ease-out both; }
@keyframes in { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-mid); }
.count { display: flex; justify-content: space-between; align-items: baseline; }
.count .cheer { font-size: 13px; color: var(--amber); font-weight: 600; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 8vw, 38px); line-height: 1.12; margin: 0; text-wrap: balance; }
h1 .bang, .qtext .bang { color: var(--amber); }
.qtext { font-size: 22px; font-weight: 600; line-height: 1.3; margin: 0; text-wrap: balance; }
.lede { font-size: 17px; color: var(--text-mid); margin: 0; }
.hint { font-size: 14px; color: var(--muted); margin: 0; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { font: inherit; font-size: 17px; min-height: 56px; width: 100%; padding: 12px 16px; border-radius: 6px; border: 1.5px solid var(--cream-deep); background: var(--white); color: var(--text); cursor: pointer; text-align: left; display: flex; align-items: center; gap: 14px; transition: background 150ms, border-color 150ms; }
.opt .tick { flex: 0 0 26px; height: 26px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; }
.opts.multi .opt .tick { border-radius: 6px; }
.opt[aria-pressed="true"] { border-color: var(--navy); background: var(--cream-dark); }
.opt[aria-pressed="true"] .tick { background: var(--navy); border-color: var(--navy); }
.opt[aria-pressed="true"] .tick::after { content: ""; width: 10px; height: 6px; border: 2.5px solid var(--white); border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid3 .opt { justify-content: center; text-align: center; padding: 10px 6px; font-size: 15px; min-height: 52px; }
.grid3 .opt .tick { display: none; }
.scale { display: grid; gap: 6px; }
.scale.s5 { grid-template-columns: repeat(5, 1fr); } .scale.s7 { grid-template-columns: repeat(7, 1fr); }
.scale .opt { justify-content: center; padding: 0; min-height: 56px; font-weight: 600; }
.scale .opt .tick { display: none; }
.scale .opt[aria-pressed="true"], .grid3 .opt[aria-pressed="true"] { background: var(--navy); color: var(--white); border-color: var(--navy); }
.ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: -8px; }
.addmore { align-self: flex-start; font: inherit; font-size: 15px; font-weight: 600; color: var(--text-mid); background: transparent; border: 0; padding: 8px 0; min-height: 44px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
textarea { font: inherit; font-size: 16px; width: 100%; min-height: 120px; padding: 14px; border-radius: 6px; border: 1.5px solid var(--cream-deep); background: var(--white); color: var(--text); resize: none; line-height: 1.5; }
textarea.small { min-height: 56px; }
textarea:focus, .opt:focus-visible, button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.mic { align-self: flex-start; font: inherit; font-size: 15px; font-weight: 600; min-height: 44px; padding: 8px 14px; border-radius: 4px; border: 1.5px solid var(--cream-deep); background: var(--white); color: var(--text); display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.mic[aria-pressed="true"] { border-color: var(--amber); background: #FBF4E4; }
.mic[aria-pressed="true"] svg { color: var(--amber); }
.spacer { flex: 1; min-height: 8px; }
.btn { font: inherit; font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; min-height: 56px; width: 100%; border: 0; border-radius: 4px; background: var(--navy); color: var(--white); cursor: pointer; }
.btn[disabled] { opacity: 0.35; cursor: default; }
.skip { align-self: center; font: inherit; font-size: 15px; color: var(--text-mid); background: transparent; border: 0; min-height: 44px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.err { color: #8C4A2F; font-size: 14px; margin: 0; }
.stu { display: flex; gap: 14px; align-items: center; background: var(--cream-dark); border-radius: 10px; padding: 14px 16px; }
.stu img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex: 0 0 auto; }
.stu p { margin: 0; font-size: 15px; color: var(--text-mid); }
.howlong { background: var(--white); border-left: 3px solid var(--amber); border-radius: 6px; padding: 14px 16px; margin: 0; font-size: 16px; line-height: 1.55; color: var(--text); }
.privacy a { color: var(--text-mid); }
.celebrate { position: fixed; inset: 0; z-index: 100; background: rgba(15, 18, 21, 0.96); color: var(--white); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; padding: 24px; animation: fade 300ms ease-out both; }
.celebrate h1 { color: var(--white); font-size: 40px; animation: rise 420ms 300ms ease-out both; }
.celebrate p { color: var(--cream-dark); margin: 0; max-width: 340px; animation: rise 420ms 450ms ease-out both; }
.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.confetti .cf { position: absolute; top: -20px; display: block; animation-name: cf-fall; animation-timing-function: cubic-bezier(.25,.6,.4,1); animation-fill-mode: both; }
@keyframes cf-fall { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 85% { opacity: 1; } 100% { transform: translate(var(--dx), 105vh) rotate(var(--rot)); opacity: 0; } }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes rise { from { transform: translateY(14px); opacity: 0 } to { transform: none; opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .screen, .celebrate, .celebrate h1, .celebrate p { animation: none; } .confetti { display: none; } }
</style>

    var r = new SR(); m.rec = r;
    r.lang = navigator.language && /^en/i.test(navigator.language) ? navigator.language : 'en-GB';
    r.continuous = !IS_ANDROID; r.interimResults = true; r.maxAlternatives = 1;
    r.onresult = function (ev) {
      var tmp = '';
      for (var i = ev.resultIndex; i < ev.results.length; i++) { if (ev.results[i].isFinal) addHeard(m, ev.results[i][0].transcript); else tmp += ev.results[i][0].transcript; }
      show(m, tmp);
    };
    r.onerror = function (e) { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { m.wanted = false; alertErr('Your microphone is blocked. You can allow it in your browser settings, or type instead.'); } };
    r.onend = function () {
      show(m, '');
      if (m.wanted && mic === m && Date.now() - m.started < MIC_MAX_MS) { setTimeout(function () { if (m.wanted && mic === m) { try { micListen(m); } catch (e) { stopMic(); } } }, 120); return; }
      if (mic === m) { mic = null; micIdle(m.btn); }
    };
    r.start();
  }
  function toggleMic(btn, ta) {
    if (!SR || !ta) return;
    var same = mic && mic.btn === btn; stopMic(); if (same) return;
    var m = { btn: btn, ta: ta, wanted: true, started: Date.now(), done: ta.value.replace(/\s+$/, ''), lastFinal: '' };
    mic = m;
    try { micListen(m); btn.setAttribute('aria-pressed', 'true'); btn.querySelector('span').textContent = 'Listening… tap to stop'; }
    catch (e) { mic = null; alertErr('Speaking isn’t available on this browser. Typing works just as well.'); }
  }
  function alertErr(msg) { var e = document.getElementById('err'); e.textContent = msg; e.hidden = false; }

  // What the app on this phone knows (counts only, never notes), so answers can be compared with what people actually did.
  function usage() {
    try {
      var s = JSON.parse(localStorage.getItem('showup-v1') || 'null'); if (!s || !s.habit) return null;
      var e = s.entries || {}, days = Object.keys(e).map(Number).sort(function (a, b) { return a - b; });
      var day = Math.floor((Date.now() - new Date(s.habit.start + 'T12:00:00').getTime()) / 864e5) + 1;
      return { habit: s.habit.what, mode: s.habit.mode, length: s.habit.length, day: day, showups: days.length,
        lighter: days.filter(function (d) { return e[d].kind === 'dimmer'; }).length, comebacks: days.filter(function (d) { return e[d].comeback; }).length,
        view: (s.settings || {}).view };
    } catch (err) { return null; }
  }


  function confettiHTML(n) {
    var bits = '', cols = ['#C9930A', '#F5F1EB', '#FFFFFF', '#888880', '#EDE8DF'];
    for (var i = 0; i < n; i++) {
      var x = Math.random() * 100, dx = (Math.random() * 60 - 30).toFixed(0), rot = (Math.random() * 720 - 360).toFixed(0);
      var w = 6 + Math.random() * 6, h2 = 8 + Math.random() * 10, d = (1.6 + Math.random() * 1.4).toFixed(2), del = (Math.random() * 0.5).toFixed(2);
      bits += '<i class="cf" style="left:' + x.toFixed(1) + '%;width:' + w.toFixed(0) + 'px;height:' + h2.toFixed(0) + 'px;background:' + cols[i % cols.length] + ';--dx:' + dx + 'vw;--rot:' + rot + 'deg;animation-duration:' + d + 's;animation-delay:' + del + 's;border-radius:' + (i % 3 ? '2px' : '50%') + '"></i>';
    }
    return '<div class="confetti" aria-hidden="true">' + bits + '</div>';
  }
  async function send() {
    stopMic();
    var err = document.getElementById('err'), btn = document.getElementById('send'); err.hidden = true;
    var out = { v: 3, route: route(), answers: {}, usage: usage(), name: ((A.name || {}).text || '').trim().slice(0, 80), view: window.innerWidth < 600 ? 'phone' : 'desktop' };
    list().forEach(function (x) {
      var a = A[x.k] || {}, p = a.pick, text = (a.text || '').trim().slice(0, 4000);
      if ((p && (x.multi ? p.length : String(p))) || text) out.answers[x.k] = { pick: p ? (x.multi ? p.slice() : p) : null, text: text };
    });
    if (!sb) { err.textContent = 'Couldn’t connect just now. Your answers are saved, so try again in a moment.'; err.hidden = false; return; }
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      var sess = (await sb.auth.getSession()).data.session;
      if (!sess) { var r = await sb.auth.signInAnonymously(); if (r.error) throw r.error; sess = r.data.session; }
      var ins = await sb.from('showup_feedback').insert({ user_id: sess.user.id, question: 'tester-feedback', answer: JSON.stringify(out) });
      if (ins.error) throw ins.error;
      try { localStorage.removeItem(DRAFT); } catch (e) {}
      bar.style.width = '100%'; backBtn.hidden = true;
      var el = document.createElement('div'); el.className = 'celebrate'; el.setAttribute('role', 'status');
      el.innerHTML = confettiHTML(70) + '<h1>Thank you' + (out.name ? ', ' + esc(out.name) : '') + '.</h1><p>That took real effort, and it’s exactly what makes <span class="brand">Let’s Go<span class="bang">!</span></span> better. I read every answer.</p><p><b>Stu</b></p>';
      document.body.appendChild(el);
      try { if (navigator.vibrate) navigator.vibrate([60, 40, 60]); } catch (e) {}
      main.innerHTML = '';
    } catch (e2) {
      btn.disabled = false; btn.textContent = 'Send my feedback';
      err.textContent = 'Couldn’t send just now. Your answers are saved, so try again in a moment.'; err.hidden = false;
    }
  }
  // Pre-fill how much they've used it, from the app on this phone, so they just confirm it.
  (function () { var u = usage(); if (!u || A.route) return; A.route = { pick: u.showups >= 5 ? R.most : u.showups >= 1 ? R.few : R.setup }; saveDraft(); })();
  if (typeof step === 'number' && step >= list().length) step = 'name';
  render();
})();
</script>
