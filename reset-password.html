<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password — The Living Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --navy: #0F1215; --navy-mid: #1C2B3A; --gold: #E8A800; --gold-light: #F5C842;
  --cream: #F9F7F2; --text-dark: #111820; --text-muted: #8899AA; --border: #E2D9CE;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--navy);
  color: var(--cream);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 2rem;
}
.login-card {
  background: #161D24;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 2.5rem 2.5rem 2rem;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.4);
}
.logo-area { text-align: center; margin-bottom: 2rem; }
.logo-box {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--gold); color: var(--navy);
  padding: 0.4rem 0.9rem; border-radius: 4px;
  font-size: 1.1rem; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 1rem;
}
.tagline { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--cream); font-style: italic; margin-bottom: 0.25rem; }
.subtagline { font-size: 0.75rem; color: var(--text-muted); letter-spacing: 0.05em; }
.form-group { margin-bottom: 1rem; }
label {
  display: block; font-size: 0.72rem; font-weight: 500;
  letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.4rem;
}
input[type="password"] {
  width: 100%; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12); border-radius: 6px;
  padding: 0.75rem 1rem; font-size: 0.95rem; color: var(--cream);
  font-family: 'Inter', sans-serif; transition: border-color 0.15s; outline: none;
}
input[type="password"]:focus { border-color: var(--gold); }
input::placeholder { color: rgba(255,255,255,0.2); }
.btn-primary {
  width: 100%; background: var(--gold); color: var(--navy);
  border: none; border-radius: 6px; padding: 0.85rem;
  font-size: 0.85rem; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; cursor: pointer; margin-top: 0.5rem;
  transition: background 0.15s, transform 0.1s;
}
.btn-primary:hover { background: var(--gold-light); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.message {
  margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 6px;
  font-size: 0.82rem; display: none; line-height: 1.5;
}
.message.success { background: rgba(59,109,17,0.2); border: 1px solid rgba(59,109,17,0.4); color: #7EC84E; display: block; }
.message.error { background: rgba(200,50,50,0.15); border: 1px solid rgba(200,50,50,0.3); color: #FF7070; display: block; }
.hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.3rem; }
.footer-note { text-align: center; margin-top: 1.5rem; font-size: 0.7rem; color: rgba(255,255,255,0.2); }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo-area">
    <div class="logo-box">TLR</div>
    <div class="tagline">Set a new password</div>
    <div class="subtagline">The Living Room · Member Access</div>
  </div>

  <div id="loading-state" style="text-align:center;padding:1rem 0;color:var(--text-muted);font-size:0.85rem;">
    Verifying your reset link…
  </div>

  <div id="form-state" style="display:none">
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="new-password" placeholder="Choose a new password" autocomplete="new-password">
      <div class="hint">At least 8 characters</div>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirm-password" placeholder="Type it again" autocomplete="new-password">
    </div>
    <button class="btn-primary" id="update-btn" onclick="updatePassword()">Set new password →</button>
    <div id="message" class="message"></div>
  </div>

  <div id="error-state" style="display:none;text-align:center;">
    <p style="color:#FF7070;font-size:0.85rem;margin-bottom:1rem;">This reset link has expired or is invalid.</p>
    <a href="login.html" style="color:var(--gold);font-size:0.85rem;">← Back to sign in</a>
  </div>
</div>

<div class="footer-note">Your progress is saved securely to your account</div>

<script>
const SUPABASE_URL = 'https://tsusrzkpzevpiuvsppls.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzdXNyemtwemV2cGl1dnNwcGxzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NDAzMzUsImV4cCI6MjEwMTMxNjMzNX0.UQD9BaOjYWNOEVeV3QCF2sdlNc9SYJ2PrcZgpCtlQ8s';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Supabase fires PASSWORD_RECOVERY when user arrives via reset link
_supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('form-state').style.display = '';
    document.getElementById('new-password').focus();
  } else if (event === 'SIGNED_IN' && !session) {
    showError();
  }
});

// If no event fires within 4 seconds, the link is likely invalid
setTimeout(() => {
  if (document.getElementById('loading-state').style.display !== 'none') {
    showError();
  }
}, 4000);

function showError() {
  document.getElementById('loading-state').style.display = 'none';
  document.getElementById('error-state').style.display = '';
}

async function updatePassword() {
  const pw = document.getElementById('new-password').value;
  const confirm = document.getElementById('confirm-password').value;
  const msg = document.getElementById('message');
  const btn = document.getElementById('update-btn');

  msg.className = 'message';

  if (pw.length < 8) {
    msg.className = 'message error';
    msg.textContent = 'Password must be at least 8 characters.';
    return;
  }
  if (pw !== confirm) {
    msg.className = 'message error';
    msg.textContent = 'Passwords don\'t match — please check and try again.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Saving…';

  const { error } = await _supabase.auth.updateUser({ password: pw });

  if (error) {
    msg.className = 'message error';
    msg.textContent = error.message;
    btn.disabled = false;
    btn.textContent = 'Set new password →';
  } else {
    msg.className = 'message success';
    msg.textContent = 'Password updated! Taking you to your dashboard…';
    setTimeout(() => window.location.replace('index.html'), 2000);
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') updatePassword();
});
</script>
</body>
</html>
