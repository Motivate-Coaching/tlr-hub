<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — The Living Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --navy: #0F1215; --navy-mid: #1C2B3A; --gold: #E8A800; --gold-light: #F5C842;
  --cream: #F9F7F2; --text-dark: #111820; --text-muted: #8899AA; --border: #E2D9CE;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--navy);
  color: var(--cream);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 2rem;
}

.login-card {
  background: #161D24;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 2.5rem 2.5rem 2rem;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.4);
}

.logo-area {
  text-align: center;
  margin-bottom: 2rem;
}
.logo-box {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--gold);
  color: var(--navy);
  padding: 0.4rem 0.9rem;
  border-radius: 4px;
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  margin-bottom: 1rem;
}
.tagline {
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem;
  color: var(--cream);
  font-style: italic;
  margin-bottom: 0.25rem;
}
.subtagline {
  font-size: 0.75rem;
  color: var(--text-muted);
  letter-spacing: 0.05em;
}

.form-group { margin-bottom: 1rem; }
label {
  display: block;
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 0.4rem;
}
input[type="email"], input[type="password"] {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 6px;
  padding: 0.75rem 1rem;
  font-size: 0.95rem;
  color: var(--cream);
  font-family: 'Inter', sans-serif;
  transition: border-color 0.15s;
  outline: none;
}
input[type="email"]:focus, input[type="password"]:focus {
  border-color: var(--gold);
}
input::placeholder { color: rgba(255,255,255,0.2); }

.btn-primary {
  width: 100%;
  background: var(--gold);
  color: var(--navy);
  border: none;
  border-radius: 6px;
  padding: 0.85rem;
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  margin-top: 0.5rem;
  transition: background 0.15s, transform 0.1s;
}
.btn-primary:hover { background: var(--gold-light); }
.btn-primary:active { transform: scale(0.99); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

.message {
  margin-top: 1rem;
  padding: 0.75rem 1rem;
  border-radius: 6px;
  font-size: 0.82rem;
  display: none;
  line-height: 1.5;
}
.message.success { background: rgba(59,109,17,0.2); border: 1px solid rgba(59,109,17,0.4); color: #7EC84E; display: block; }
.message.error { background: rgba(200,50,50,0.15); border: 1px solid rgba(200,50,50,0.3); color: #FF7070; display: block; }

.join-link {
  text-align: center;
  margin-top: 1.75rem;
  padding-top: 1.5rem;
  border-top: 1px solid rgba(255,255,255,0.07);
}
.join-link p {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-bottom: 0.35rem;
}
.join-link a {
  font-size: 0.82rem;
  color: var(--gold);
  text-decoration: none;
  font-weight: 500;
  transition: color 0.15s;
}
.join-link a:hover { color: var(--gold-light); }

.footer-note {
  text-align: center;
  margin-top: 1.5rem;
  font-size: 0.7rem;
  color: rgba(255,255,255,0.2);
  letter-spacing: 0.03em;
}
</style>
</head>
<body>

<div class="login-card">
  <div class="logo-area">
    <div class="logo-box">TLR</div>
    <div class="tagline">Your Resource Library</div>
    <div class="subtagline">The Living Room · Member Access</div>
  </div>

  <div class="form-group">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
  </div>
  <button class="btn-primary" id="signin-btn" onclick="signIn()">Sign In →</button>
  <div id="message" class="message"></div>

  <div class="join-link">
    <p>Not a member yet?</p>
    <a href="https://www.motivate-coaching.com" target="_blank">Find out about The Living Room →</a>
  </div>
</div>

<div class="footer-note">Your progress is saved securely to your account</div>

<script>
const SUPABASE_URL = 'https://tsusrzkpzevpiuvsppls.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzdXNyemtwemV2cGl1dnNwcGxzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NDAzMzUsImV4cCI6MjEwMTMxNjMzNX0.UQD9BaOjYWNOEVeV3QCF2sdlNc9SYJ2PrcZgpCtlQ8s';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// If already logged in, go straight to library
_supabase.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.replace('/index.html');
});

_supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && session) window.location.replace('/index.html');
});

async function signIn() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('message');
  const btn = document.getElementById('signin-btn');

  msg.className = 'message';
  if (!email || !password) {
    msg.className = 'message error';
    msg.textContent = 'Please enter your email and password.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Signing in…';

  const { error } = await _supabase.auth.signInWithPassword({ email, password });

  if (error) {
    msg.className = 'message error';
    if (error.message === 'Invalid login credentials') {
      msg.innerHTML = 'Email or password not recognised. If you\'re not yet a member, <a href="https://www.motivate-coaching.com" style="color:#FF7070;" target="_blank">find out how to join →</a>';
    } else {
      msg.textContent = error.message;
    }
    btn.disabled = false;
    btn.textContent = 'Sign In →';
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') signIn();
});
</script>
</body>
</html>
